[package]
name = "spis"
version = "0.1.0"
edition = "2021"
description = "Evidence-grade reference corpus tooling (Rust port of the former Python scripts)"
license = "Apache-2.0"
# The repository every crawl worker clones and every worker receipt names.
# Read through CARGO_PKG_REPOSITORY, so a fork changes it here and nowhere else.
repository = "https://github.com/wisent-ai/spis.git"
# Live qualification targets require real external dependencies and explicit fixtures.
autotests = false

[[bin]]
name = "spis"
path = "src/main.rs"

[[test]]
name = "accessibility-live"
path = "tests/accessibility/main.rs"
harness = false

[[test]]
name = "catalog-type-lifecycle"
path = "tests/catalog_type/main.rs"
harness = false

[[test]]
name = "capture-widths-refusals"
path = "tests/capture_widths/main.rs"
harness = false

[[test]]
name = "cli-contract"
path = "tests/cli/main.rs"
harness = false

[dependencies]
ureq = { version = "2", features = ["gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
image = "0.25"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
anyhow = "1"
parking_lot = "0.12"
libc = "0.2"
# Every wait on another program (Stado reading a credential) says on stderr
# what it waits for, where and since when, and how it ended.
stado-wait = { git = "https://github.com/wisent-ai/stado", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }
regex = "1"
base64 = "0.22"
hex = "0.4"
url = "2"
# Every timestamp Spis writes, as UTC calendar time (already in the lock
# through stado-wait).
chrono = "0.4"
# The loopback backend Spis Desktop talks to (`spis serve`).
tiny_http = "0.12"
# The status codes `spis serve` answers with, by their standard names
# (already in the lock through stado-wait's reqwest).
http = "1.5"
# Renders a CLI capture's terminal text into its state PNGs.
fontdue = "0.9"
# Reads every fetched page's tags, attributes and text by the WHATWG HTML
# parsing algorithm (`spis::html`), one reader for every command.
scraper = "0.27.0"

[build-dependencies]
sha2 = "0.10"
# The build script's git calls say on stderr what they wait for, like every other wait.
stado-wait = { git = "https://github.com/wisent-ai/stado", rev = "692c0438d24117735c61373c0c178f1c1e21b080" }

[profile.release]
strip = true
