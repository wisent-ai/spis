[package]
name = "spis"
version = "0.1.0"
edition = "2021"
description = "Evidence-grade reference corpus tooling (Rust port of the former Python scripts)"
license = "Apache-2.0"

[[bin]]
name = "spis"
path = "src/main.rs"

[[test]]
name = "crawl_host_resolved_executable"
path = "tests/crawl/host_resolved_executable.rs"

[dependencies]
ureq = { version = "2", features = ["gzip", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
image = "0.25"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
anyhow = "1"
parking_lot = "0.12"
libc = "0.2"
regex = "1"
base64 = "0.22"
hex = "0.4"
url = "2"

[build-dependencies]
sha2 = "0.10"

[profile.release]
strip = true
